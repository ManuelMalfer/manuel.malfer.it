<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel Malfer</title>
<meta name="description" content="Manuel Malfer — Consulente alimentare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#050505;color:#eaeaea;overflow:hidden;font-family:'Space Mono',monospace}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
    padding:24px;animation:fade 1.6s .6s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:10px;
    box-shadow:0 0 10px rgba(255,255,255,.8);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .links{display:flex;gap:10px}
  .links a{pointer-events:auto;color:#eaeaea;text-decoration:none;padding:11px 18px;border:1px solid rgba(255,255,255,.3);
    border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .25s,color .25s,border-color .25s,transform .25s}
  .links a:hover,.links a:focus-visible{background:#eaeaea;color:#050505;border-color:#eaeaea;transform:translateY(-2px);outline:none}
  .hint{opacity:.5}
  .tag{max-width:28ch;opacity:.8;text-transform:none;letter-spacing:0;font-size:.85rem;line-height:1.55}
  h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:640px){
    .ui{padding:18px}
    .row:last-child{flex-direction:column;align-items:flex-start}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.ui{animation:none}.dot{animation:none}}
</style>
</head>
<body>
  <h1 class="sr">Manuel Malfer</h1>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="ui">
    <div class="row"><span><i class="dot"></i>manuel.malfer.it</span></div>
    <div class="row">
      <p class="tag">Consulente alimentare</p>
      <div class="links">
        <a href="https://www.instagram.com/malfer_jr/" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:manuel.malfer@marchispa.com">Scrivimi</a>
      </div>
    </div>
  </div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mouse = {x:-9999, y:-9999, vx:0, vy:0, r:140, on:false};
  let W, H, P = [], t = 0, raf;

  // gradiente rosa -> viola -> azzurro in base alla posizione orizzontale
  const grad = k => {
    const stops = [[255,79,163],[124,92,255],[0,212,255]];
    const s = k*2, i = Math.min(1, Math.floor(s)), f = s - i;
    return stops[i].map((v,n) => Math.round(v + (stops[i+1][n]-v)*f));
  };

  function build(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    if (W < 1 || H < 1) return false;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,W,H);

    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
    const small = W < 640;
    const face = s => `italic 900 ${s}px "Exo 2", "Arial Black", sans-serif`;
    // dimensione scelta misurando il testo, così sta sempre nello schermo
    o.font = face(100);
    const wide = Math.max(o.measureText('MANUEL').width, o.measureText('MALFER').width);
    const fs = Math.min(100*(W*(small ? .82 : .72))/wide, 230);
    o.font = face(fs);
    const lh = fs*.98;
    o.fillText('MANUEL', W/2, H/2 - lh/2);
    o.fillText('MALFER', W/2, H/2 + lh/2);

    const data = o.getImageData(0,0,W,H).data;
    // passo adattivo: limita il numero di particelle (~9000) per restare fluidi
    let gap = Math.max(3, Math.round(fs/36));
    while (true){
      let n = 0;
      for (let y=0; y<H; y+=gap) for (let x=0; x<W; x+=gap) if (data[(y*W+x)*4+3] > 128) n++;
      if (n <= 14000) break; gap++;
    }
    P = [];
    for (let y=0; y<H; y+=gap) for (let x=0; x<W; x+=gap){
      if (data[(y*W+x)*4+3] > 128){
        const v = 205 + Math.random()*50|0;   // bianchi con lieve variazione di luminosità
        P.push({
          x: W/2 + (Math.random()-.5)*W, y: H/2 + (Math.random()-.5)*H, hx:x, hy:y, vx:0, vy:0,
          s: gap*.6 + Math.random()*.7, ph: Math.random()*6.28, heat: 0,
          c: [v,v,v]
        });
      }
    }
  }

  function frame(){
    t += .016;
    ctx.fillStyle = 'rgba(5,5,5,.3)'; ctx.fillRect(0,0,W,H);
    // il raggio cresce con la velocità del cursore: più muovi, più coinvolgi
    mouse.vx *= .9; mouse.vy *= .9;
    const speed = Math.min(1, Math.hypot(mouse.vx, mouse.vy)/40);
    const R = mouse.r*(1 + speed*.9);
    for (const p of P){
      let near = 0;
      if (mouse.on){
        const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
        if (d2 < R*R){
          const d = Math.sqrt(d2) || 1, k = 1-d/R;
          near = k;
          const f = k*8;                     // respinge
          p.vx += dx/d*f - dy/d*f*.9;            // + vortice attorno al cursore
          p.vy += dy/d*f + dx/d*f*.9;
          p.vx += mouse.vx*k*.12; p.vy += mouse.vy*k*.12; // trascinati dalla corsa
        }
      }
      p.heat += (near - p.heat)*.12;
      // respiro lento: la forma "vive" anche da ferma
      const amp = still ? 0 : .9;
      const tx = p.hx + Math.sin(t*1.3 + p.ph)*amp, ty = p.hy + Math.cos(t*1.1 + p.ph)*amp;
      p.vx += (tx-p.x)*.04; p.vy += (ty-p.y)*.04;
      p.vx *= .87; p.vy *= .87;
      p.x += p.vx; p.y += p.vy;
      const sp = Math.min(1, Math.hypot(p.vx,p.vy)/8), h = Math.min(1, p.heat*1.6 + sp*.4);
      // vicino al cursore le particelle si accendono (verso il bianco-azzurro)
      ctx.fillStyle = `rgb(${p.c[0]+(255-p.c[0])*h|0},${p.c[1]+(255-p.c[1])*h|0},${p.c[2]+(255-p.c[2])*h|0})`;
      const sz = p.s*(1 + p.heat*.8) + sp*1.2;
      ctx.fillRect(p.x, p.y, sz, sz);
    }
    if (mouse.on){ // alone morbido attorno al cursore
      const g = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,R);
      g.addColorStop(0,'rgba(255,255,255,.07)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(mouse.x-R, mouse.y-R, R*2, R*2);
    }
    raf = requestAnimationFrame(frame); // il cursore deve funzionare sempre, anche con "riduci movimento"
  }

  function burst(x, y){
    for (const p of P){
      const dx = p.x-x, dy = p.y-y, d = Math.hypot(dx,dy) || 1;
      if (d < 320){ const f = (1-d/320)*38; p.vx += dx/d*f; p.vy += dy/d*f; }
    }
  }

  function start(){
    cancelAnimationFrame(raf);
    if (build() === false) return;
    if (still){ P.forEach(p => { p.x = p.hx; p.y = p.hy; }); }
    frame();
  }

  const move = e => {
    if (mouse.on){ mouse.vx = mouse.vx*.5 + (e.clientX-mouse.x)*.5; mouse.vy = mouse.vy*.5 + (e.clientY-mouse.y)*.5; }
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
  };
  addEventListener('pointermove', move);
  addEventListener('pointerdown', e => { move(e); if (!e.target.closest('a')) burst(e.clientX, e.clientY); });
  addEventListener('pointerup', e => { if (e.pointerType === 'touch') mouse.on = false; });
  document.addEventListener('pointerleave', () => { mouse.on = false; });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(start, 150); });
  (document.fonts ? document.fonts.load('italic 900 100px "Exo 2"').then(start, start) : start());
})();
</script>
</body>
</html>
